name: Build

# Every push to main: build, run game tests, and refresh the rolling "dev" prerelease with the jar.
# Pushing a tag like v0.2.0: build that version and publish a proper release.
# Pull requests: build and test only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          base=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}+dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Game tests
        run: ./gradlew runGameTestServer -Pmod_version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: cryosat-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

      - name: Publish dev prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev build/libs/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build ${{ steps.version.outputs.version }}" \
            --notes "Latest build from main (${GITHUB_SHA::7}). Untested in a real client, use at your own risk."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "CryoSat ${{ steps.version.outputs.version }}" --generate-notes
